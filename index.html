<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘도 시작합니다">
<meta name="theme-color" content="#1a2e1a">
<title>🌱 오늘도 시작합니다 | 인증 타임스탬프 카메라</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap');
  :root{--gd:#1a2e1a;--gm:#2d5a2d;--ga:#5cb85c;--gl:#a8d5a8;--gn:#00e676;--rr:#e94560}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Noto Sans KR',sans-serif;height:100vh;height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none}

  .header{background:linear-gradient(135deg,var(--gd),#1e3a1e);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ga);flex-shrink:0;z-index:10}
  .brand{display:flex;align-items:center;gap:5px}
  .brand-icon{font-size:15px}
  .brand-name{font-size:12px;font-weight:900;color:var(--gl);letter-spacing:-0.3px}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ga);opacity:.7;margin-left:3px}
  .sync-badge{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(92,184,92,.3);cursor:pointer;color:var(--gl)}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0}
  .sync-dot.synced{background:var(--gn);box-shadow:0 0 6px var(--gn)}
  .sync-dot.syncing{background:#ffc107;animation:pulse 1s infinite}
  .sync-dot.local{background:#ffc107}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .cam{flex:1;position:relative;overflow:hidden;background:#000}
  #vid{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .ts-ov{position:absolute;top:10px;left:10px;pointer-events:none;z-index:5}
  .ts-t{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.9);line-height:1}
  .ts-d{font-family:'JetBrains Mono',monospace;font-size:13px;color:rgba(255,255,255,.95);text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:4px}
  .ts-s{font-family:'JetBrains Mono',monospace;font-size:9px;text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:2px}
  .ts-s.ok{color:var(--gn)}.ts-s.no{color:#ffc107}
  .wm-ov{position:absolute;bottom:10px;right:10px;pointer-events:none;z-index:5;text-align:right}
  .wm-b{font-size:12px;font-weight:900;color:rgba(255,255,255,.45);text-shadow:0 0 8px rgba(0,0,0,.9)}
  .wm-s{font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(168,213,168,.35);text-shadow:0 0 6px rgba(0,0,0,.9)}
  .rec-i{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;z-index:5;opacity:0;transition:opacity .3s}
  .rec-i.on{opacity:1}
  .rec-d{width:10px;height:10px;border-radius:50%;background:var(--rr);animation:rb 1s infinite}
  @keyframes rb{0%,100%{opacity:1}50%{opacity:.3}}
  .rec-t{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--rr);text-shadow:0 0 8px rgba(0,0,0,.8)}
  .rec-tm{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,.8);text-shadow:0 0 8px rgba(0,0,0,.8)}
  .off-i{position:absolute;bottom:30px;left:8px;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(255,255,255,.25);text-shadow:0 0 6px rgba(0,0,0,.95);z-index:5;pointer-events:none}

  .ctrls{background:linear-gradient(0deg,#0a0a0a,var(--gd));padding:10px 16px 18px;display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;z-index:10}
  .btn-rec{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:0 0;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn-rec .inn{width:52px;height:52px;border-radius:50%;background:var(--rr);transition:all .3s}
  .btn-rec.on .inn{width:26px;height:26px;border-radius:6px}
  .btn-s{width:46px;height:46px;border-radius:50%;border:2px solid rgba(168,213,168,.3);background:rgba(255,255,255,.05);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
  .btn-s:active{background:rgba(92,184,92,.15)}
  .btn-s.rdy{border-color:var(--gn);color:var(--gn)}
  .btn-s .bdg{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--rr);font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center}
  .btn-s.rdy .bdg{display:flex}

  .init{position:absolute;inset:0;background:linear-gradient(160deg,#0a120a,var(--gd),#0a120a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:10px;padding:28px;text-align:center}
  .init-l{font-size:48px;margin-bottom:4px}
  .init h2{font-size:22px;color:var(--gl);font-weight:900;letter-spacing:-.5px}
  .init .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ga);opacity:.7;margin-top:-4px}
  .init p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
  .init-f{display:flex;flex-direction:column;gap:6px;margin:4px 0}
  .init-fi{font-size:12px;color:var(--gl);display:flex;align-items:center;gap:6px}
  .init-fi span{font-size:14px}
  .btn-go{margin-top:6px;padding:13px 40px;background:linear-gradient(135deg,var(--gm),var(--ga));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(92,184,92,.3)}
  .btn-go:active{transform:scale(.96)}
  .init-ft{margin-top:8px;font-size:9px;color:rgba(255,255,255,.2);font-family:'JetBrains Mono',monospace;line-height:1.5}

  .toast{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-size:13px;color:#fff;background:rgba(0,0,0,.8);padding:10px 18px;border-radius:10px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:85%;white-space:pre-line;backdrop-filter:blur(4px)}
  .toast.show{opacity:1}

  .mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
  .mbg.show{display:flex}
  .mdl{background:var(--gd);border:1px solid rgba(92,184,92,.2);border-radius:16px;padding:20px;width:92%;max-width:340px}
  .mdl h3{font-size:15px;color:var(--gn);margin-bottom:12px;text-align:center}
  .mdl-pv{width:100%;border-radius:8px;background:#000;margin-bottom:10px;max-height:180px;object-fit:contain}
  .mdl-info{font-size:10px;color:rgba(255,255,255,.45);text-align:center;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
  .mdl-btns{display:flex;flex-direction:column;gap:8px}
  .mbtn{padding:14px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
  .mbtn.p{background:var(--ga);color:#fff;font-size:16px}
  .mbtn.s{background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:13px}
  .mbtn.c{background:0 0;color:rgba(255,255,255,.3);font-size:12px;padding:8px}
  .mbtn:active{opacity:.7}
  .mbtn-note{font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-top:4px;line-height:1.4}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <span class="brand-icon">🌱</span>
    <span class="brand-name">오늘도 시작합니다</span>
    <span class="brand-sub">PROOF CAM</span>
  </div>
  <div class="sync-badge" id="syncBadge">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">대기</span>
  </div>
</div>

<div class="cam">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="cvs"></canvas>
  <div class="ts-ov" id="tsOv" style="display:none">
    <div class="ts-t" id="tsT">--:--:--</div>
    <div class="ts-d" id="tsD">----.--.--</div>
    <div class="ts-s" id="tsS"></div>
  </div>
  <div class="wm-ov" id="wmOv" style="display:none">
    <div class="wm-b">🌱 오늘도 시작합니다</div>
    <div class="wm-s">PROOF CAM v1.0</div>
  </div>
  <div class="rec-i" id="recI">
    <div class="rec-d"></div>
    <span class="rec-t">REC</span>
    <span class="rec-tm" id="recTm">00:00</span>
  </div>
  <div class="off-i" id="offI"></div>
  <div class="toast" id="toast"></div>

  <div class="init" id="initScr">
    <div class="init-l">🌱</div>
    <h2>오늘도 시작합니다</h2>
    <div class="sub">PROOF CAM — 인증 타임스탬프 카메라</div>
    <p>갓생 밸런스 게임 공식 인증 도구</p>
    <div class="init-f">
      <div class="init-fi"><span>🔒</span> NTP 서버 시간 (조작 불가)</div>
      <div class="init-fi"><span>🎥</span> 동영상 + 시간 오버레이</div>
      <div class="init-fi"><span>🌱</span> 커뮤니티 워터마크 삽입</div>
    </div>
    <button class="btn-go" id="btnGo">카메라 시작</button>
    <div class="init-ft">Developed by 열박연구소<br>🌱 오늘도 시작합니다 전용</div>
  </div>
</div>

<div class="ctrls">
  <button class="btn-s" id="btnFlip">🔄</button>
  <button class="btn-rec" id="btnRec"><div class="inn"></div></button>
  <button class="btn-s" id="btnSave">💾<span class="bdg">1</span></button>
</div>

<div class="mbg" id="mbg">
  <div class="mdl">
    <h3>🌱 인증 영상 저장</h3>
    <video id="pvVid" class="mdl-pv" controls playsinline></video>
    <div class="mdl-info" id="mInfo">--</div>
    <div class="mdl-btns">
      <button class="mbtn p" id="btnMain" style="display:none">📤 갤러리에 저장 / 공유</button>
      <button class="mbtn s" id="btnOpen">🔗 새 탭에서 열기 (길게 눌러 저장)</button>
      <button class="mbtn c" id="btnClose">닫기</button>
    </div>
    <div class="mbtn-note" id="saveNote"></div>
  </div>
</div>

<script>
(function(){
  var ntpOff=0,synced=false,str=null,mr=null,chunks=[];
  var rec=false,recSt=0,recTi=null,blob=null,fname='';
  var facing='environment',camOk=false;

  var vid=document.getElementById('vid');
  var cvs=document.getElementById('cvs');
  var cx=cvs.getContext('2d');
  var $=function(id){return document.getElementById(id)};

  // Helpers
  var ttm;
  function toast(m,d){clearTimeout(ttm);$('toast').textContent=m;$('toast').classList.add('show');ttm=setTimeout(function(){$('toast').classList.remove('show')},d||2000)}
  function p2(n){return String(n).padStart(2,'0')}
  function now(){return new Date(Date.now()+ntpOff)}
  function fmtT(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
  function fmtMs(d){return '.'+String(d.getMilliseconds()).padStart(3,'0').slice(0,2)}
  function fmtD(d){var w=['일','월','화','수','목','금','토'];return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' ('+w[d.getDay()]+')'}
  function fmtSz(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'}

  // NTP
  async function sync(){
    $('syncDot').className='sync-dot syncing';$('syncStatus').textContent='동기화';
    var apis=[
      {u:'https://worldtimeapi.org/api/timezone/Asia/Seoul',p:function(d){return new Date(d.datetime).getTime()}},
      {u:'https://worldtimeapi.org/api/ip',p:function(d){return new Date(d.datetime).getTime()}},
      {u:'https://timeapi.io/api/time/current/zone?timeZone=Asia/Seoul',p:function(d){return new Date(d.year+'-'+p2(d.month)+'-'+p2(d.day)+'T'+p2(d.hour)+':'+p2(d.minute)+':'+p2(d.seconds)+'.000+09:00').getTime()}}
    ];
    for(var i=0;i<apis.length;i++){
      try{
        var t1=Date.now(),ac=new AbortController(),ti=setTimeout(function(){ac.abort()},5000);
        var r=await fetch(apis[i].u,{signal:ac.signal});clearTimeout(ti);
        var t2=Date.now(),data=await r.json(),st=apis[i].p(data);
        if(isNaN(st))continue;
        ntpOff=st-t1-(t2-t1)/2;synced=true;
        $('syncDot').className='sync-dot synced';$('syncStatus').textContent='NTP';
        $('tsS').textContent='🔒 NTP 서버 시간 (조작불가)';$('tsS').className='ts-s ok';
        $('offI').textContent='offset '+(ntpOff>0?'+':'')+Math.round(ntpOff)+'ms | '+apis[i].u.split('/')[2];
        return;
      }catch(e){}
    }
    synced=false;ntpOff=0;
    $('syncDot').className='sync-dot local';$('syncStatus').textContent='로컬';
    $('tsS').textContent='⚠ 로컬 시간 (자동시간 ON 권장)';$('tsS').className='ts-s no';
    $('offI').textContent='서버 미연결 → 로컬 시간';
    toast('서버 연결 실패\n로컬 시간으로 작동',2500);
  }
  $('syncBadge').onclick=function(){if(camOk){toast('재동기화...',1500);sync()}};

  // Camera
  async function startCam(){
    try{
      if(str)str.getTracks().forEach(function(t){t.stop()});
      str=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true});
      vid.srcObject=str;await vid.play();
      camOk=true;$('initScr').style.display='none';
      $('tsOv').style.display='block';$('wmOv').style.display='block';
      renderLoop();
    }catch(e){alert('카메라 접근 실패: '+e.message)}
  }

  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

  var rl=false;
  function renderLoop(){
    if(rl)return;rl=true;
    function go(){
      if(!camOk){rl=false;return}
      if(vid.readyState>=2){
        var vw=vid.videoWidth||1280,vh=vid.videoHeight||720;
        cvs.width=vw;cvs.height=vh;
        cx.drawImage(vid,0,0,vw,vh);
        var n=now(),ts=fmtT(n)+fmtMs(n),ds=fmtD(n);
        var sc=Math.max(vw/400,1),pd=14*sc;

        // Timestamp box
        var bw=Math.min(vw*.78,350*sc),bh=74*sc;
        cx.fillStyle='rgba(0,0,0,.6)';rr(cx,pd,pd,bw,bh,8*sc);cx.fill();
        cx.fillStyle=synced?'#00e676':'#ffc107';rr(cx,pd,pd,4*sc,bh,2*sc);cx.fill();
        var tx=pd+12*sc;
        cx.font='bold '+Math.round(30*sc)+'px JetBrains Mono,monospace';cx.fillStyle='#fff';cx.textBaseline='top';cx.fillText(ts,tx,pd+5*sc);
        cx.font=Math.round(12*sc)+'px JetBrains Mono,monospace';cx.fillStyle='rgba(255,255,255,.9)';cx.fillText(ds,tx,pd+39*sc);
        cx.font='bold '+Math.round(9*sc)+'px JetBrains Mono,monospace';cx.fillStyle=synced?'#00e676':'#ffc107';
        cx.fillText(synced?'🔒 NTP SYNCED | TAMPER-PROOF':'⚠ LOCAL TIME',tx,pd+56*sc);

        // Watermark
        var wt1='🌱 오늘도 시작합니다',wt2='PROOF CAM v1.0 | 열박연구소';
        cx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';
        var w1=cx.measureText(wt1).width;
        cx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';
        var w2=cx.measureText(wt2).width;
        var wmW=Math.max(w1,w2)+20*sc,wmY=vh-pd-34*sc;
        cx.fillStyle='rgba(0,0,0,.35)';rr(cx,vw-pd-wmW,wmY,wmW,34*sc,6*sc);cx.fill();
        cx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';cx.fillStyle='rgba(255,255,255,.55)';cx.textBaseline='top';
        cx.fillText(wt1,vw-pd-wmW+10*sc,wmY+4*sc);
        cx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';cx.fillStyle='rgba(168,213,168,.45)';
        cx.fillText(wt2,vw-pd-wmW+10*sc,wmY+22*sc);

        // REC
        if(rec){
          var el=Math.floor((Date.now()-recSt)/1000),rw=95*sc,rh=24*sc,rx=vw-pd-rw,ry=pd;
          cx.fillStyle='rgba(233,69,96,.9)';rr(cx,rx,ry,rw,rh,5*sc);cx.fill();
          cx.fillStyle='#fff';cx.beginPath();cx.arc(rx+11*sc,ry+rh/2,4*sc,0,Math.PI*2);cx.fill();
          cx.font='bold '+Math.round(12*sc)+'px JetBrains Mono,monospace';cx.textBaseline='top';
          cx.fillText('REC '+p2(Math.floor(el/60))+':'+p2(el%60),rx+20*sc,ry+5*sc);
        }
      }
      var n2=now();$('tsT').textContent=fmtT(n2)+fmtMs(n2);$('tsD').textContent=fmtD(n2);
      requestAnimationFrame(go);
    }
    go();
  }

  // Recording
  function startRec(){
    if(!camOk){toast('카메라를 먼저 시작하세요');return}
    chunks=[];
    var cs=cvs.captureStream(24);
    if(str)str.getAudioTracks().forEach(function(t){cs.addTrack(t)});
    var mm=['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm','video/mp4'],opt={};
    for(var j=0;j<mm.length;j++){if(MediaRecorder.isTypeSupported(mm[j])){opt={mimeType:mm[j]};break}}
    try{mr=new MediaRecorder(cs,opt)}catch(e){toast('녹화 실패: '+e.message,3000);return}

    mr.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data)};
    mr.onstop=function(){
      if(chunks.length===0){toast('녹화 데이터 없음',2000);return}
      blob=new Blob(chunks,{type:opt.mimeType||'video/webm'});
      if(blob.size<1000){toast('녹화가 너무 짧습니다\n2초 이상 녹화하세요',2500);blob=null;return}
      var n=now(),ext=(opt.mimeType&&opt.mimeType.indexOf('mp4')>-1)?'mp4':'webm';
      fname='PROOF_'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'_'+p2(n.getHours())+p2(n.getMinutes())+p2(n.getSeconds())+'.'+ext;
      $('btnSave').classList.add('rdy');
      showModal();
    };
    mr.onerror=function(){toast('녹화 오류 발생',2000);stopRec()};

    mr.start(1000);
    rec=true;recSt=Date.now();
    $('btnRec').classList.add('on');$('recI').classList.add('on');
    toast('🔴 녹화 시작',1000);
    recTi=setInterval(function(){
      var el=Math.floor((Date.now()-recSt)/1000);
      $('recTm').textContent=p2(Math.floor(el/60))+':'+p2(el%60);
    },250);
  }

  function stopRec(){
    if(mr&&mr.state!=='inactive')mr.stop();
    rec=false;$('btnRec').classList.remove('on');$('recI').classList.remove('on');
    if(recTi)clearInterval(recTi);$('recTm').textContent='00:00';
  }

  // Save Modal
  var blobUrl=null;
  function showModal(){
    if(!blob)return;
    if(blobUrl)URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(blob);
    $('pvVid').src=blobUrl;
    var dur=Math.floor((Date.now()-recSt)/1000);
    $('mInfo').textContent=fname+' | '+fmtSz(blob.size)+' | '+p2(Math.floor(dur/60))+':'+p2(dur%60);

    // Check share API
    var canShare=false;
    try{
      if(navigator.share&&navigator.canShare){
        var testFile=new File([new Blob(['test'])], 'test.webm',{type:'video/webm'});
        canShare=navigator.canShare({files:[testFile]});
      }
    }catch(e){}

    if(canShare){
      $('btnMain').style.display='flex';
      $('btnOpen').querySelector('span') || ($('btnOpen').textContent='🔗 새 탭에서 열기');
      $('saveNote').textContent='💡 "갤러리에 저장"을 누르면 → 파일에 저장 선택';
    }else{
      $('btnMain').style.display='none';
      $('saveNote').textContent='💡 새 탭에서 열린 영상을 길게 누르면 저장됩니다';
    }
    $('mbg').classList.add('show');
  }

  // PRIMARY: navigator.share (갤러리 저장)
  $('btnMain').onclick=async function(){
    if(!blob)return;
    try{
      var file=new File([blob],fname,{type:blob.type,lastModified:Date.now()});
      await navigator.share({files:[file],title:'🌱 오늘도 시작합니다 인증',text:fname});
      toast('✅ 저장 완료!',2000);
      $('mbg').classList.remove('show');
    }catch(e){
      if(e.name==='AbortError'){toast('취소됨',1000)}
      else{toast('공유 실패 — 새 탭 열기를 사용하세요',2500)}
    }
  };

  // FALLBACK: 새 탭에서 열기
  $('btnOpen').onclick=function(){
    if(!blobUrl)return;
    window.open(blobUrl,'_blank');
    toast('새 탭에서 영상 열림\n⬇ 영상을 길게 눌러 저장',3500);
    $('mbg').classList.remove('show');
  };

  $('btnClose').onclick=function(){$('mbg').classList.remove('show')};

  // Events
  $('btnGo').onclick=function(){startCam();sync()};
  $('btnRec').onclick=function(){if(rec)stopRec();else startRec()};
  $('btnFlip').onclick=function(){
    if(rec){toast('녹화 중 전환 불가',1500);return}
    facing=facing==='environment'?'user':'environment';
    toast(facing==='user'?'📱 전면':'📸 후면',800);
    camOk=false;rl=false;startCam();
  };
  $('btnSave').onclick=function(){if(blob)showModal();else toast('녹화된 영상 없음',1500)};

  setInterval(sync,300000);
})();
</script>
</body>
</html>
