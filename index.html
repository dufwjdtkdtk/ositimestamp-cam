<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2e1a">
<title>🌱 오늘도 시작합니다 | PROOF CAM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+KR:wght@400;700;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Noto Sans KR',sans-serif;height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation}

  .block{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#0a120a,#1a2e1a,#0a120a);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:14px}
  .block h2{font-size:20px;color:#a8d5a8;font-weight:900}
  .block p{font-size:14px;color:rgba(255,255,255,.6);line-height:1.7}
  .bbtn{padding:14px 32px;background:#5cb85c;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:320px}
  .bbtn:active{transform:scale(.96)}
  .bbtn.copied{background:#00e676;color:#000}

  .hdr{background:linear-gradient(135deg,#1a2e1a,#1e3a1e);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #5cb85c;flex-shrink:0;z-index:10}
  .brand{display:flex;align-items:center;gap:5px}
  .brand b{font-size:12px;color:#a8d5a8}
  .brand small{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5cb85c;opacity:.7;margin-left:3px}
  .sync{display:flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(92,184,92,.3);cursor:pointer;color:#a8d5a8}
  .sdot{width:7px;height:7px;border-radius:50%;background:#666;flex-shrink:0}
  .sdot.ok{background:#00e676;box-shadow:0 0 6px #00e676}
  .sdot.wait{background:#ffc107;animation:pu 1s infinite}
  .sdot.no{background:#ffc107}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}

  .cam{flex:1;position:relative;overflow:hidden;background:#000}
  #vid{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .ov{position:absolute;pointer-events:none;z-index:5}
  .ov.tl{top:10px;left:10px}
  .ov.br{bottom:10px;right:10px;text-align:right}
  .tt{font:800 30px/1 'JetBrains Mono',monospace;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.9)}
  .td{font:13px 'JetBrains Mono',monospace;color:rgba(255,255,255,.95);text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:4px}
  .tx{font:9px 'JetBrains Mono',monospace;text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:2px}
  .tx.ok{color:#00e676}.tx.no{color:#ffc107}
  .wt{font:900 12px 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.45);text-shadow:0 0 8px rgba(0,0,0,.9)}
  .ws{font:8px 'JetBrains Mono',monospace;color:rgba(168,213,168,.35);text-shadow:0 0 6px rgba(0,0,0,.9)}
  .ri{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;z-index:5;opacity:0;transition:opacity .3s}
  .ri.on{opacity:1}
  .rd{width:10px;height:10px;border-radius:50%;background:#e94560;animation:bl 1s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
  .rt{font:700 13px 'JetBrains Mono',monospace;color:#e94560;text-shadow:0 0 8px rgba(0,0,0,.8)}
  .rm{font:11px 'JetBrains Mono',monospace;color:rgba(255,255,255,.8);text-shadow:0 0 8px rgba(0,0,0,.8)}
  .oi{position:absolute;bottom:30px;left:8px;font:8px 'JetBrains Mono',monospace;color:rgba(255,255,255,.25);z-index:5;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.95)}

  .ct{background:linear-gradient(0deg,#0a0a0a,#1a2e1a);padding:10px 16px 18px;display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;z-index:10}
  .rb{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:0 0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .rb i{width:52px;height:52px;border-radius:50%;background:#e94560;transition:all .3s;display:block}
  .rb.on i{width:26px;height:26px;border-radius:6px}
  .sb{width:46px;height:46px;border-radius:50%;border:2px solid rgba(168,213,168,.3);background:rgba(255,255,255,.05);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sb:active{background:rgba(92,184,92,.15)}
  .sb.rdy{border-color:#00e676;color:#00e676}

  .init{position:absolute;inset:0;background:linear-gradient(160deg,#0a120a,#1a2e1a,#0a120a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:10px;padding:28px;text-align:center}
  .init h2{font-size:22px;color:#a8d5a8;font-weight:900}
  .init .sub{font:11px 'JetBrains Mono',monospace;color:#5cb85c;opacity:.7}
  .init p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
  .fi{font-size:12px;color:#a8d5a8;margin:2px 0}
  .bg{margin-top:6px;padding:13px 40px;background:linear-gradient(135deg,#2d5a2d,#5cb85c);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .bg:active{transform:scale(.96)}
  .ft{margin-top:8px;font:9px 'JetBrains Mono',monospace;color:rgba(255,255,255,.2);line-height:1.5}

  .toast{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-size:13px;color:#fff;background:rgba(0,0,0,.85);padding:10px 18px;border-radius:10px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:85%;white-space:pre-line}
  .toast.show{opacity:1}

  .mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center}
  .mbg.show{display:flex}
  .mdl{background:#1a2e1a;border:1px solid rgba(92,184,92,.2);border-radius:16px;padding:20px;width:92%;max-width:340px}
  .mdl h3{font-size:15px;color:#00e676;margin-bottom:12px;text-align:center}
  .mpv{width:100%;border-radius:8px;background:#000;margin-bottom:10px;max-height:180px;object-fit:contain}
  .mi{font:10px 'JetBrains Mono',monospace;color:rgba(255,255,255,.45);text-align:center;margin-bottom:14px}
  .mb{padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
  .mb:active{opacity:.7}
  .mb.p{background:#5cb85c;color:#fff}
  .mb.c{background:0 0;color:rgba(255,255,255,.3);font-size:12px;padding:8px}
  .mn{font:11px/1.5 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.4);text-align:center;margin-top:4px}
</style>
</head>
<body>

<div class="block" id="blockScr">
  <div style="font-size:48px">🌱</div>
  <h2>오늘도 시작합니다 PROOF CAM</h2>
  <p id="blockMsg"></p>
  <button class="bbtn" id="blockBtn"></button>
  <div id="blockExtra"></div>
</div>

<div class="hdr">
  <div class="brand"><span>🌱</span><b>오늘도 시작합니다</b><small>PROOF CAM</small></div>
  <div class="sync" onclick="syncNTP()"><div class="sdot" id="sd"></div><span id="ss">대기</span></div>
</div>

<div class="cam">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="cvs"></canvas>
  <div class="ov tl" id="tov" style="display:none"><div class="tt" id="tt">--:--:--</div><div class="td" id="td"></div><div class="tx" id="tx"></div></div>

  <div class="ri" id="ri"><div class="rd"></div><span class="rt">REC</span><span class="rm" id="rm">00:00</span></div>

  <div class="toast" id="to"></div>
  <div class="init" id="initScr">
    <div style="font-size:48px">🌱</div>
    <h2>오늘도 시작합니다</h2>
    <div class="sub">PROOF CAM — 인증 타임스탬프 카메라</div>
    <p>갓생 밸런스 게임 공식 인증 도구</p>
    <div class="fi">🔒 NTP 서버 시간 (조작 불가)</div>
    <div class="fi">🎥 동영상 + 시간 오버레이</div>
    <div class="fi">🌱 커뮤니티 워터마크 삽입</div>
    <button class="bg" onclick="startApp()">카메라 시작</button>
    <div class="ft">Developed by 열박연구소<br>🌱 오늘도 시작합니다 전용</div>
  </div>
</div>

<div class="ct">
  <button class="sb" onclick="flipCam()">🔄</button>
  <button class="rb" id="rb" onclick="toggleRec()"><i></i></button>
  <button class="sb" id="svb" onclick="showSave()">💾</button>
</div>

<div class="mbg" id="mbg">
  <div class="mdl">
    <h3>🌱 인증 영상 저장</h3>
    <video id="pv" class="mpv" controls playsinline></video>
    <div class="mi" id="mi"></div>
    <button class="mb p" onclick="saveVideo()">📥 저장하기</button>
    <button class="mb c" onclick="document.getElementById('mbg').classList.remove('show')">닫기</button>
    <div class="mn" id="mn"></div>
  </div>
</div>

<script>
// ============================================
// 인앱 브라우저 감지
// ============================================
(function(){
  var ua=navigator.userAgent||'';
  var isKakao=/KAKAOTALK/i.test(ua);
  var isOther=/Line\/|NAVER|FBAN|FBAV|Instagram/i.test(ua);
  if(!isKakao&&!isOther)return;
  var isIOS=/iPhone|iPad|iPod/i.test(ua);
  var url=location.href;
  document.getElementById('blockScr').style.display='flex';
  if(isKakao){
    document.getElementById('blockMsg').innerHTML='카카오톡 브라우저에서는<br>카메라/저장이 제한됩니다';
    document.getElementById('blockBtn').textContent=isIOS?'🌐 Safari에서 열기':'🌐 Chrome에서 열기';
    document.getElementById('blockBtn').onclick=function(){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url)};
    document.getElementById('blockExtra').innerHTML='<p style="font-size:11px;color:rgba(255,255,255,.25);margin-top:10px">자동으로 안 열리면<br>'+(isIOS?'하단 Safari 아이콘 터치':'우측 상단 ⋮ → 다른 브라우저로 열기')+'</p>';
  }else{
    document.getElementById('blockMsg').innerHTML='이 브라우저에서는 제한됩니다<br>주소를 복사해서 '+(isIOS?'Safari':'Chrome')+'에서 열어주세요';
    document.getElementById('blockBtn').textContent='📋 주소 복사';
    document.getElementById('blockBtn').onclick=function(){
      try{navigator.clipboard.writeText(url)}catch(e){var t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t)}
      document.getElementById('blockBtn').textContent='✅ 복사 완료!';document.getElementById('blockBtn').classList.add('copied');
    };
  }
})();

// ============================================
// 전역 상태
// ============================================
var ntpOff=0, synced=false;
var stream=null, camReady=false, camStarting=false;
var recorder=null, chunks=[], isRec=false, recStart=0, recTimer=null;
var savedBlob=null, savedName='', blobUrl=null;
var facing='environment', rendering=false;
var canvasW=0, canvasH=0; // 캔버스 크기 고정용

var vid=document.getElementById('vid');
var cvs=document.getElementById('cvs');
var ctx=cvs.getContext('2d');

// ============================================
// 유틸
// ============================================
var _tt;
function toast(m,d){clearTimeout(_tt);var e=document.getElementById('to');e.textContent=m;e.classList.add('show');_tt=setTimeout(function(){e.classList.remove('show')},d||2000)}
function p2(n){return String(n).padStart(2,'0')}
function now(){return new Date(Date.now()+ntpOff)}
function fmtTime(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function fmtMs(d){return '.'+String(d.getMilliseconds()).padStart(3,'0').slice(0,2)}
function fmtDate(d){var w=['일','월','화','수','목','금','토'];return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' ('+w[d.getDay()]+')'}
function fmtSize(b){return b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}

// ============================================
// NTP 동기화
// ============================================
async function syncNTP(){
  document.getElementById('sd').className='sdot wait';
  document.getElementById('ss').textContent='동기화';
  var apis=[
    {u:'https://worldtimeapi.org/api/timezone/Asia/Seoul',p:function(d){return new Date(d.datetime).getTime()}},
    {u:'https://worldtimeapi.org/api/ip',p:function(d){return new Date(d.datetime).getTime()}},
    {u:'https://timeapi.io/api/time/current/zone?timeZone=Asia/Seoul',p:function(d){return new Date(d.year+'-'+p2(d.month)+'-'+p2(d.day)+'T'+p2(d.hour)+':'+p2(d.minute)+':'+p2(d.seconds)+'.000+09:00').getTime()}}
  ];
  for(var i=0;i<apis.length;i++){
    try{
      var t1=Date.now(),r=await fetch(apis[i].u),t2=Date.now(),d=await r.json(),st=apis[i].p(d);
      if(isNaN(st))continue;
      ntpOff=st-t1-(t2-t1)/2; synced=true;
      document.getElementById('sd').className='sdot ok';
      document.getElementById('ss').textContent='NTP';
      document.getElementById('tx').textContent='🔒 NTP 서버 시간 (조작불가)';
      document.getElementById('tx').className='tx ok';
      document.getElementById('oi').textContent='offset '+(ntpOff>0?'+':'')+Math.round(ntpOff)+'ms';
      return;
    }catch(e){}
  }
  synced=false; ntpOff=0;
  document.getElementById('sd').className='sdot no';
  document.getElementById('ss').textContent='로컬';
  document.getElementById('tx').textContent='⚠ 로컬 시간';
  document.getElementById('tx').className='tx no';
}

// ============================================
// 카메라 (뮤텍스로 중복 시작 방지)
// ============================================
async function startApp(){
  if(camStarting){toast('카메라 시작 중...');return}
  camStarting=true;
  try{
    // 기존 스트림 완전 정리
    if(stream){
      stream.getTracks().forEach(function(t){t.stop()});
      stream=null;
    }
    vid.srcObject=null;
    camReady=false;

    // 잠깐 대기 (이전 리소스 해제 시간)
    await new Promise(function(r){setTimeout(r,300)});

    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing, width:{ideal:1280}, height:{ideal:720}},
      audio:true
    });
    vid.srcObject=stream;
    await vid.play();

    // ★ 캔버스 크기를 여기서 한 번만 설정
    await new Promise(function(r){
      if(vid.videoWidth>0){r();return}
      vid.onloadedmetadata=function(){r()};
      setTimeout(r,2000); // 안전 타임아웃
    });

    canvasW=vid.videoWidth||1280;
    canvasH=vid.videoHeight||720;
    cvs.width=canvasW;
    cvs.height=canvasH;

    camReady=true;
    document.getElementById('initScr').style.display='none';
    document.getElementById('tov').style.display='block';
    document.getElementById('wov').style.display='block';

    if(!rendering) startRender();
    syncNTP();

  }catch(e){
    toast('카메라 실패: '+e.message,3000);
  }finally{
    camStarting=false;
  }
}

// ============================================
// 렌더링 (캔버스 크기 재설정 안 함!)
// ============================================
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

function startRender(){
  if(rendering)return;
  rendering=true;
  (function loop(){
    if(!camReady){rendering=false;return}
    if(vid.readyState>=2){
      var vw=canvasW, vh=canvasH; // ★ 고정 크기 사용 (매 프레임 재설정 안 함)
      ctx.drawImage(vid,0,0,vw,vh);
      var n=now(),ts=fmtTime(n)+fmtMs(n),ds=fmtDate(n);
      var sc=Math.max(vw/400,1),pd=14*sc;

      // 타임스탬프 박스
      var bw=Math.min(vw*.78,350*sc),bh=74*sc;
      ctx.fillStyle='rgba(0,0,0,.6)';rr(ctx,pd,pd,bw,bh,8*sc);ctx.fill();
      ctx.fillStyle=synced?'#00e676':'#ffc107';rr(ctx,pd,pd,4*sc,bh,2*sc);ctx.fill();
      var tx=pd+12*sc;
      ctx.font='bold '+Math.round(30*sc)+'px JetBrains Mono,monospace';ctx.fillStyle='#fff';ctx.textBaseline='top';ctx.fillText(ts,tx,pd+5*sc);
      ctx.font=Math.round(12*sc)+'px JetBrains Mono,monospace';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(ds,tx,pd+39*sc);
      ctx.font='bold '+Math.round(9*sc)+'px JetBrains Mono,monospace';ctx.fillStyle=synced?'#00e676':'#ffc107';
      ctx.fillText(synced?'🔒 NTP SYNCED | TAMPER-PROOF':'⚠ LOCAL TIME',tx,pd+56*sc);

      // 워터마크
      var w1='🌱 오늘도 시작합니다',w2='PROOF CAM v1.0 | 열박연구소';
      ctx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';var m1=ctx.measureText(w1).width;
      ctx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';var m2=ctx.measureText(w2).width;
      var ww=Math.max(m1,m2)+20*sc,wy=vh-pd-34*sc;
      ctx.fillStyle='rgba(0,0,0,.35)';rr(ctx,vw-pd-ww,wy,ww,34*sc,6*sc);ctx.fill();
      ctx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';ctx.fillStyle='rgba(255,255,255,.55)';ctx.textBaseline='top';ctx.fillText(w1,vw-pd-ww+10*sc,wy+4*sc);
      ctx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';ctx.fillStyle='rgba(168,213,168,.45)';ctx.fillText(w2,vw-pd-ww+10*sc,wy+22*sc);

      // REC 뱃지
      if(isRec){
        var el=Math.floor((Date.now()-recStart)/1000);
        ctx.fillStyle='rgba(233,69,96,.9)';var rx=vw-pd-95*sc;
        rr(ctx,rx,pd,95*sc,24*sc,5*sc);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(rx+11*sc,pd+12*sc,4*sc,0,Math.PI*2);ctx.fill();
        ctx.font='bold '+Math.round(12*sc)+'px JetBrains Mono,monospace';
        ctx.fillText('REC '+p2(Math.floor(el/60))+':'+p2(el%60),rx+20*sc,pd+5*sc);
      }
    }
    // HTML 오버레이 업데이트
    var n2=now();
    document.getElementById('tt').textContent=fmtTime(n2)+fmtMs(n2);
    document.getElementById('td').textContent=fmtDate(n2);
    requestAnimationFrame(loop);
  })();
}

// ============================================
// 녹화
// ============================================
function toggleRec(){if(isRec)stopRec();else startRec()}

function startRec(){
  if(!camReady){toast('카메라를 먼저 시작하세요');return}
  if(isRec){toast('이미 녹화 중');return}

  chunks=[];

  // ★ captureStream을 15fps로 낮춤 (안정성 ↑)
  var canvasStream=cvs.captureStream(15);

  // 오디오 트랙 추가
  if(stream){
    var audioTracks=stream.getAudioTracks();
    for(var i=0;i<audioTracks.length;i++){
      canvasStream.addTrack(audioTracks[i]);
    }
  }

  // ★ webm VP8 우선 (MP4는 모바일 Chrome에서 불안정)
  var mime='';
  var tryList=['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm'];
  for(var j=0;j<tryList.length;j++){
    if(MediaRecorder.isTypeSupported(tryList[j])){mime=tryList[j];break}
  }

  try{
    recorder=new MediaRecorder(canvasStream, mime?{mimeType:mime}:{});
  }catch(e){
    toast('녹화 시작 실패',2000);return;
  }

  recorder.ondataavailable=function(e){
    if(e.data && e.data.size>0) chunks.push(e.data);
  };

  recorder.onstop=function(){
    var duration=Date.now()-recStart;
    if(duration<2000){toast('⚠ 2초 이상 녹화해주세요',2500);return}
    if(chunks.length===0){toast('녹화 데이터 없음',2000);return}

    var rawBlob=new Blob(chunks,{type:mime||'video/webm'});
    if(rawBlob.size<1000){toast('녹화 파일이 너무 작습니다',2000);return}

    // ★ webm duration 메타데이터 수정 (카톡 호환)
    fixWebmDuration(rawBlob, duration).then(function(fixedBlob){
      savedBlob=fixedBlob;
      var n=now();
      savedName='PROOF_'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'_'+p2(n.getHours())+p2(n.getMinutes())+p2(n.getSeconds())+'.webm';
      document.getElementById('svb').classList.add('rdy');
      showSave();
    });
  };

  recorder.onerror=function(e){
    toast('녹화 오류: '+(e.error?e.error.message:''),2500);
    cleanupRec();
  };

  // ★ 2초 간격으로 데이터 수집 (안정적)
  recorder.start(2000);
  isRec=true;
  recStart=Date.now();
  document.getElementById('rb').classList.add('on');
  document.getElementById('ri').classList.add('on');
  toast('🔴 녹화 시작',1000);

  recTimer=setInterval(function(){
    var s=Math.floor((Date.now()-recStart)/1000);
    document.getElementById('rm').textContent=p2(Math.floor(s/60))+':'+p2(s%60);
  },250);
}

function stopRec(){
  if(recorder && recorder.state==='recording'){
    // ★ 마지막 데이터 강제 수집 후 정지
    try{recorder.requestData()}catch(e){}
    // 약간 대기 후 stop (마지막 청크 수신 보장)
    setTimeout(function(){
      try{recorder.stop()}catch(e){}
      cleanupRec();
    },500);
  }else{
    cleanupRec();
  }
}

function cleanupRec(){
  isRec=false;
  document.getElementById('rb').classList.remove('on');
  document.getElementById('ri').classList.remove('on');
  if(recTimer)clearInterval(recTimer);
  document.getElementById('rm').textContent='00:00';
}

// ============================================
// ★ WebM Duration 수정 (핵심 수정)
// Chrome MediaRecorder는 webm에 duration을 안 씀
// 이걸 수정하지 않으면 카톡/갤러리에서 재생 길이가 이상해짐
// ============================================
function fixWebmDuration(blob, durationMs){
  return new Promise(function(resolve){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var buf=new Uint8Array(fr.result);
        var durationSec=durationMs; // webm duration은 밀리초 단위

        // EBML에서 Duration 엘리먼트(0x4489) 검색 (처음 1000바이트 내)
        var limit=Math.min(buf.length,1000);
        for(var i=0;i<limit-1;i++){
          if(buf[i]===0x44 && buf[i+1]===0x89){
            // 다음 바이트: EBML 크기 (보통 0x88 = 8바이트)
            if(buf[i+2]===0x88){
              // float64로 duration 쓰기
              var dv=new DataView(buf.buffer, i+3, 8);
              dv.setFloat64(0, durationSec, false); // big-endian
              resolve(new Blob([buf],{type:blob.type}));
              return;
            }
            // 다른 크기 인코딩인 경우 (4바이트: 0x84)
            if(buf[i+2]===0x84){
              var dv2=new DataView(buf.buffer, i+3, 4);
              dv2.setFloat32(0, durationSec, false);
              resolve(new Blob([buf],{type:blob.type}));
              return;
            }
          }
        }
        // Duration 엘리먼트 못 찾으면 원본 반환
        resolve(blob);
      }catch(e){
        resolve(blob); // 에러 시 원본 반환
      }
    };
    fr.onerror=function(){resolve(blob)};
    fr.readAsArrayBuffer(blob);
  });
}

// ============================================
// 저장
// ============================================
function showSave(){
  if(!savedBlob){toast('녹화된 영상 없음');return}
  if(blobUrl)URL.revokeObjectURL(blobUrl);
  blobUrl=URL.createObjectURL(savedBlob);
  document.getElementById('pv').src=blobUrl;
  var dur=Math.max(1,Math.round((Date.now()-recStart)/1000));
  document.getElementById('mi').textContent=savedName+' | '+fmtSize(savedBlob.size)+' | '+p2(Math.floor(dur/60))+':'+p2(dur%60);
  document.getElementById('mn').textContent='📂 저장 후 내 파일 → Download에서 확인';
  document.getElementById('mbg').classList.add('show');
}

function saveVideo(){
  if(!savedBlob){toast('저장할 영상 없음');return}
  if(!blobUrl)blobUrl=URL.createObjectURL(savedBlob);

  var a=document.createElement('a');
  a.href=blobUrl;
  a.download=savedName;
  a.style.cssText='position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0.01';
  document.body.appendChild(a);
  var evt=new MouseEvent('click',{bubbles:true,cancelable:true,view:window});
  a.dispatchEvent(evt);
  toast('📥 저장 중...\n상단 알림바에서 확인하세요',4000);
  document.getElementById('mbg').classList.remove('show');
  setTimeout(function(){try{document.body.removeChild(a)}catch(e){}},5000);
}

// ============================================
// 카메라 전환
// ============================================
function flipCam(){
  if(isRec){toast('녹화 중 전환 불가');return}
  facing=facing==='environment'?'user':'environment';
  toast(facing==='user'?'📱 전면':'📸 후면',800);
  camReady=false;rendering=false;startApp();
}

// 5분마다 NTP 재동기화
setInterval(function(){if(camReady)syncNTP()},300000);
