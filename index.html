<style>

  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:'Noto Sans KR',sans-serif;height:100dvh;width:100vw;overflow:hidden;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation}

  .block{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#0a120a,#1a2e1a,#0a120a);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:14px}

  .hdr{background:linear-gradient(135deg,#1a2e1a,#1e3a1e);padding:6px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #5cb85c;flex-shrink:0;z-index:10}
  .brand{display:flex;align-items:center;gap:5px}
  .brand b{font-size:12px;color:#a8d5a8}
  .brand small{font-family:'JetBrains Mono',monospace;font-size:9px;color:#5cb85c;opacity:.7;margin-left:3px}

  .cam{flex:1;position:relative;overflow:hidden;background:#000}
  video{width:100%;height:100%;object-fit:cover;display:block}
  canvas{display:none}
  .ov{position:absolute;pointer-events:none;z-index:5}
  .ov.tl{top:10px;left:10px}
  .ov.br{bottom:10px;right:10px;text-align:right}
  .tt{font:800 30px/1 'JetBrains Mono',monospace;color:#fff;text-shadow:0 0 12px rgba(0,0,0,.95),0 2px 4px rgba(0,0,0,.9)}
  .td{font:13px 'JetBrains Mono',monospace;color:rgba(255,255,255,.95);text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:4px}
  .tx{font:9px 'JetBrains Mono',monospace;text-shadow:0 0 8px rgba(0,0,0,.95);margin-top:2px}
  .tx.ok{color:#00e676}.tx.no{color:#ffc107}
  .wt{font:900 12px 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.45);text-shadow:0 0 8px rgba(0,0,0,.9)}
  .ws{font:8px 'JetBrains Mono',monospace;color:rgba(168,213,168,.35);text-shadow:0 0 6px rgba(0,0,0,.9)}
  .ri{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:5px;z-index:5;opacity:0;transition:opacity .3s}
  .ri.on{opacity:1}
  .rd{width:10px;height:10px;border-radius:50%;background:#e94560;animation:bl 1s infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
  .rt{font:700 13px 'JetBrains Mono',monospace;color:#e94560;text-shadow:0 0 8px rgba(0,0,0,.8)}
  .rm{font:11px 'JetBrains Mono',monospace;color:rgba(255,255,255,.8);text-shadow:0 0 8px rgba(0,0,0,.8)}
  .oi{position:absolute;bottom:30px;left:8px;font:8px 'JetBrains Mono',monospace;color:rgba(255,255,255,.25);z-index:5;pointer-events:none;text-shadow:0 0 6px rgba(0,0,0,.95)}

  .ct{background:linear-gradient(0deg,#0a0a0a,#1a2e1a);padding:10px 16px 18px;display:flex;align-items:center;justify-content:center;gap:24px;flex-shrink:0;z-index:10}
  .rb{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:0 0;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .rb i{width:52px;height:52px;border-radius:50%;background:#e94560;transition:all .3s;display:block}
  .rb.on i{width:26px;height:26px;border-radius:6px}
  .sb{width:46px;height:46px;border-radius:50%;border:2px solid rgba(168,213,168,.3);background:rgba(255,255,255,.05);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sb:active{background:rgba(92,184,92,.15)}

  .init p{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6}
  .fi{font-size:12px;color:#a8d5a8;margin:2px 0}
  .bg{margin-top:6px;padding:13px 40px;background:linear-gradient(135deg,#2d5a2d,#5cb85c);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
  .bg:active{transform:scale(.96)}
  .ft{margin-top:8px;font:9px 'JetBrains Mono',monospace;color:rgba(255,255,255,.2);line-height:1.5}

  .toast{position:absolute;bottom:18%;left:50%;transform:translateX(-50%);font-size:13px;color:#fff;background:rgba(0,0,0,.85);padding:10px 18px;border-radius:10px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;max-width:85%;white-space:pre-line}
  .toast.show{opacity:1}

  .mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:none;align-items:center;justify-content:center}
  .mbg.show{display:flex}
  .mdl{background:#1a2e1a;border:1px solid rgba(92,184,92,.2);border-radius:16px;padding:20px;width:92%;max-width:340px}
  .mdl h3{font-size:15px;color:#00e676;margin-bottom:12px;text-align:center}
  .mpv{width:100%;border-radius:8px;background:#000;margin-bottom:10px;max-height:180px;object-fit:contain}
  .mi{font:10px 'JetBrains Mono',monospace;color:rgba(255,255,255,.45);text-align:center;margin-bottom:14px}
  .mb{padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}

  .mb.p{background:#5cb85c;color:#fff}
  .mb.c{background:0 0;color:rgba(255,255,255,.3);font-size:12px;padding:8px}
  .mn{font:11px/1.5 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.4);text-align:center;margin-top:4px}
</style>

<body>

<!-- 인앱 브라우저 차단 화면 -->

<script>
// ============================================
// 1. 인앱 브라우저 감지
// ============================================
(function(){

      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(pageUrl);
    };

      '<div style="margin-top:4px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(92,184,92,.2);border-radius:12px;padding:14px 18px;width:100%;max-width:320px;font-size:14px;color:#a8d5a8;line-height:2">' +
      (isIOS
        ? '1. 우측 하단 <b>Safari</b> 아이콘 터치<br>2. 또는 하단 <b>공유(↑)</b> → <b>Safari로 열기</b>'
        : '1. 우측 상단 <b>⋮</b> 터치<br>2. <b>다른 브라우저로 열기</b>') +
      '</div>';

  } else {
    // 기타 인앱 브라우저: URL 복사 안내
    document.getElementById('blockMsg').innerHTML = '이 브라우저에서는<br>카메라/저장이 제한됩니다<br><br>주소를 복사해서<br><b>' + (isIOS?'Safari':'Chrome') + '</b>에서 열어주세요';
    document.getElementById('blockBtn').textContent = '📋 주소 복사하기';
    document.getElementById('blockBtn').onclick = function(){
      try{navigator.clipboard.writeText(pageUrl)}catch(e){
        var ta=document.createElement('textarea');ta.value=pageUrl;ta.style.cssText='position:fixed;opacity:0';
        document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
      }
      document.getElementById('blockBtn').textContent='✅ 복사 완료!';
      document.getElementById('blockBtn').classList.add('copied');
    };
    document.getElementById('blockExtra').innerHTML = '<div class="url-box" style="margin-top:8px">' + pageUrl + '</div>';
  }
})();

// ============================================
// 2. 메인 앱 (정상 브라우저에서만 실행)
// ============================================
var ntpOff=0,synced=false,stream=null,rec=null,chunks=[];
var isRec=false,recSt=0,recTi=null;
var blob=null,fname='',burl=null;
var face='environment',camOk=false,rendering=false;
var vid=document.getElementById('v'),cvs=document.getElementById('c'),cx=cvs.getContext('2d');

var _t;
function toast(m,d){clearTimeout(_t);var e=document.getElementById('to');e.textContent=m;e.classList.add('show');_t=setTimeout(function(){e.classList.remove('show')},d||2000)}
function p2(n){return String(n).padStart(2,'0')}
function gT(){return new Date(Date.now()+ntpOff)}
function fT(d){return p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds())}
function fM(d){return '.'+String(d.getMilliseconds()).padStart(3,'0').slice(0,2)}
function fD(d){var w=['일','월','화','수','목','금','토'];return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' ('+w[d.getDay()]+')'}
function fS(b){return b<1048576?(b/1024).toFixed(1)+'KB':(b/1048576).toFixed(1)+'MB'}

// ============================================
// 3. NTP 동기화
// ============================================
async function syncNTP(){
  if(!camOk)return;
  document.getElementById('sd').className='sdot wait';document.getElementById('ss').textContent='동기화';
  var apis=[
    {u:'https://worldtimeapi.org/api/timezone/Asia/Seoul',p:function(d){return new Date(d.datetime).getTime()}},
    {u:'https://worldtimeapi.org/api/ip',p:function(d){return new Date(d.datetime).getTime()}},
    {u:'https://timeapi.io/api/time/current/zone?timeZone=Asia/Seoul',p:function(d){return new Date(d.year+'-'+p2(d.month)+'-'+p2(d.day)+'T'+p2(d.hour)+':'+p2(d.minute)+':'+p2(d.seconds)+'.000+09:00').getTime()}}
  ];
  for(var i=0;i<apis.length;i++){try{
    var t1=Date.now(),r=await fetch(apis[i].u),t2=Date.now(),d=await r.json(),st=apis[i].p(d);
    if(isNaN(st))continue;
    ntpOff=st-t1-(t2-t1)/2;synced=true;
    document.getElementById('sd').className='sdot ok';document.getElementById('ss').textContent='NTP';
    document.getElementById('tx').textContent='🔒 NTP 서버 시간 (조작불가)';document.getElementById('tx').className='tx ok';
    document.getElementById('oi').textContent='offset '+(ntpOff>0?'+':'')+Math.round(ntpOff)+'ms';
    return;
  }catch(e){}}
  synced=false;ntpOff=0;
  document.getElementById('sd').className='sdot no';document.getElementById('ss').textContent='로컬';
  document.getElementById('tx').textContent='⚠ 로컬 시간';document.getElementById('tx').className='tx no';
}

// ============================================
// 4. 카메라
// ============================================
async function startApp(){
  try{
    if(stream)stream.getTracks().forEach(function(t){t.stop()});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:face,width:{ideal:1280},height:{ideal:720}},audio:true});
    vid.srcObject=stream;await vid.play();camOk=true;
    document.getElementById('is').style.display='none';
    document.getElementById('tov').style.display='block';
    document.getElementById('wov').style.display='block';
    doRender();syncNTP();
  }catch(e){alert('카메라 실패: '+e.message)}
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath()}

function doRender(){
  if(rendering)return;rendering=true;
  (function lp(){
    if(!camOk){rendering=false;return}
    if(vid.readyState>=2){
      var vw=vid.videoWidth||1280,vh=vid.videoHeight||720;cvs.width=vw;cvs.height=vh;cx.drawImage(vid,0,0,vw,vh);
      var n=gT(),ts=fT(n)+fM(n),ds=fD(n),sc=Math.max(vw/400,1),pd=14*sc;
      // Timestamp
      var bw=Math.min(vw*.78,350*sc),bh=74*sc;
      cx.fillStyle='rgba(0,0,0,.6)';rr(cx,pd,pd,bw,bh,8*sc);cx.fill();
      cx.fillStyle=synced?'#00e676':'#ffc107';rr(cx,pd,pd,4*sc,bh,2*sc);cx.fill();
      var tx=pd+12*sc;
      cx.font='bold '+Math.round(30*sc)+'px JetBrains Mono,monospace';cx.fillStyle='#fff';cx.textBaseline='top';cx.fillText(ts,tx,pd+5*sc);
      cx.font=Math.round(12*sc)+'px JetBrains Mono,monospace';cx.fillStyle='rgba(255,255,255,.9)';cx.fillText(ds,tx,pd+39*sc);
      cx.font='bold '+Math.round(9*sc)+'px JetBrains Mono,monospace';cx.fillStyle=synced?'#00e676':'#ffc107';
      cx.fillText(synced?'🔒 NTP SYNCED | TAMPER-PROOF':'⚠ LOCAL TIME',tx,pd+56*sc);
      // Watermark
      var w1='🌱 오늘도 시작합니다',w2='PROOF CAM v1.0 | 열박연구소';
      cx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';var m1=cx.measureText(w1).width;
      cx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';var m2=cx.measureText(w2).width;
      var ww=Math.max(m1,m2)+20*sc,wy=vh-pd-34*sc;
      cx.fillStyle='rgba(0,0,0,.35)';rr(cx,vw-pd-ww,wy,ww,34*sc,6*sc);cx.fill();
      cx.font='bold '+Math.round(14*sc)+'px Noto Sans KR,sans-serif';cx.fillStyle='rgba(255,255,255,.55)';cx.textBaseline='top';cx.fillText(w1,vw-pd-ww+10*sc,wy+4*sc);
      cx.font=Math.round(8*sc)+'px JetBrains Mono,monospace';cx.fillStyle='rgba(168,213,168,.45)';cx.fillText(w2,vw-pd-ww+10*sc,wy+22*sc);
      // REC
      if(isRec){var el=Math.floor((Date.now()-recSt)/1000);cx.fillStyle='rgba(233,69,96,.9)';var rx=vw-pd-95*sc;rr(cx,rx,pd,95*sc,24*sc,5*sc);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(rx+11*sc,pd+12*sc,4*sc,0,Math.PI*2);cx.fill();cx.font='bold '+Math.round(12*sc)+'px JetBrains Mono,monospace';cx.fillText('REC '+p2(Math.floor(el/60))+':'+p2(el%60),rx+20*sc,pd+5*sc)}
    }
    var n2=gT();document.getElementById('tt').textContent=fT(n2)+fM(n2);document.getElementById('td').textContent=fD(n2);
    requestAnimationFrame(lp);
  })();
}

// ============================================
// 5. 녹화
// ============================================
function toggleRec(){if(isRec)stopRec();else startRec()}

function startRec(){
  if(!camOk){toast('카메라를 먼저 시작하세요');return}
  chunks=[];
  var cs=cvs.captureStream(24);
  if(stream)stream.getAudioTracks().forEach(function(t){cs.addTrack(t)});
  var mime='';
  ['video/mp4','video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm'].forEach(function(m){if(!mime&&MediaRecorder.isTypeSupported(m))mime=m});
  try{rec=new MediaRecorder(cs,mime?{mimeType:mime}:{})}catch(e){toast('녹화 실패');return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size>0)chunks.push(e.data)};
  rec.onstop=onRecStop;
  rec.onerror=function(){toast('녹화 오류');stopRec()};
  rec.start(1000);isRec=true;recSt=Date.now();
  document.getElementById('rb').classList.add('on');document.getElementById('ri').classList.add('on');
  toast('🔴 녹화 시작',1000);
  recTi=setInterval(function(){var s=Math.floor((Date.now()-recSt)/1000);document.getElementById('rm').textContent=p2(Math.floor(s/60))+':'+p2(s%60)},250);
}

function stopRec(){
  if(rec&&rec.state!=='inactive')try{rec.stop()}catch(e){}
  isRec=false;document.getElementById('rb').classList.remove('on');document.getElementById('ri').classList.remove('on');
  if(recTi)clearInterval(recTi);document.getElementById('rm').textContent='00:00';
}

function onRecStop(){
  var dur=Date.now()-recSt;
  if(dur<2000){toast('⚠ 2초 이상 녹화해주세요',2500);blob=null;return}
  if(!chunks.length){toast('녹화 데이터 없음',2000);blob=null;return}
  var mime=(rec&&rec.mimeType)?rec.mimeType:'video/webm';
  blob=new Blob(chunks,{type:mime});
  if(blob.size<500){toast('녹화 파일이 비어있습니다',2000);blob=null;return}
  var ext=mime.indexOf('mp4')>=0?'mp4':'webm';
  var n=gT();fname='PROOF_'+n.getFullYear()+p2(n.getMonth()+1)+p2(n.getDate())+'_'+p2(n.getHours())+p2(n.getMinutes())+p2(n.getSeconds())+'.'+ext;
  document.getElementById('svb').classList.add('rdy');
  showSave();
}

// ============================================
// 6. 저장 (심플하게 하나만)
// ============================================
function showSave(){
  if(!blob){toast('녹화된 영상 없음');return}
  if(burl)URL.revokeObjectURL(burl);
  burl=URL.createObjectURL(blob);
  document.getElementById('pv').src=burl;
  var dur=Math.max(1,Math.round((Date.now()-recSt)/1000));
  document.getElementById('mi').textContent=fname+' | '+fS(blob.size)+' | '+p2(Math.floor(dur/60))+':'+p2(dur%60);
  var isMP4=fname.indexOf('.mp4')>=0;
  document.getElementById('mn').textContent=isMP4?'📱 MP4 형식 — 갤러리에 바로 표시됩니다':'📂 WEBM 형식 — 내 파일 → Download에서 확인';
  document.getElementById('mbg').classList.add('show');
}

function saveVideo(){
  if(!blob){toast('저장할 영상 없음');return}
  if(!burl) burl=URL.createObjectURL(blob);

  // 방법: <a> 태그를 동적 생성, 화면 밖에 배치 (display:none 아님!)
  var a = document.createElement('a');
  a.href = burl;
  a.download = fname;
  // display:none 대신 화면 밖으로 (모바일 크롬 호환)
  a.style.cssText = 'position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0.01';
  document.body.appendChild(a);

  // 클릭 이벤트 직접 발생
  try {
    var evt = new MouseEvent('click', {bubbles:true, cancelable:true, view:window});
    a.dispatchEvent(evt);
  } catch(e) {
    // 구형 브라우저 폴백
    a.click();
  }

  toast('📥 저장 중...\n상단 알림바에서 확인하세요',4000);
  document.getElementById('mbg').classList.remove('show');

  // 3초 후 정리 (너무 빨리 제거하면 다운로드 취소됨)
  setTimeout(function(){
    try{document.body.removeChild(a)}catch(e){}
  },5000);
}

function flipCam(){
  if(isRec){toast('녹화 중 전환 불가');return}
  face=face==='environment'?'user':'environment';
  toast(face==='user'?'📱 전면':'📸 후면',800);
  camOk=false;rendering=false;startApp();
}

setInterval(syncNTP,300000);
</script>
