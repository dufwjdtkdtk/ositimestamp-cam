<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>인증 타임스탬프 카메라</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+KR:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Noto Sans KR', sans-serif;
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #e94560;
    flex-shrink: 0;
    z-index: 10;
  }

  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 800;
    color: #e94560;
    letter-spacing: -0.5px;
  }

  .sync-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .sync-dot.synced { background: #00e676; box-shadow: 0 0 6px #00e676; }
  .sync-dot.syncing { background: #ffc107; animation: pulse 1s infinite; }
  .sync-dot.failed { background: #e94560; }
  .sync-dot.local { background: #ffc107; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .camera-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #videoElement {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  canvas { display: none; }

  .timestamp-overlay {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    pointer-events: none;
    z-index: 5;
  }

  .ts-main {
    font-family: 'JetBrains Mono', monospace;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 10px rgba(0,0,0,0.95), 0 2px 4px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.6);
    letter-spacing: 1px;
    line-height: 1;
  }

  .ts-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 400;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 0 8px rgba(0,0,0,0.95), 0 1px 3px rgba(0,0,0,0.9);
    margin-top: 5px;
  }

  .ts-source {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #00e676;
    text-shadow: 0 0 8px rgba(0,0,0,0.95);
    margin-top: 3px;
  }

  .ts-source.not-synced { color: #ffc107; }

  .rec-indicator {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 5;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .rec-indicator.active { opacity: 1; }

  .rec-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e94560;
    animation: recBlink 1s infinite;
  }

  @keyframes recBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .rec-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #e94560;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .rec-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(255,255,255,0.8);
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .controls {
    background: linear-gradient(0deg, #0a0a0a 0%, #1a1a2e 100%);
    padding: 16px 16px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-shrink: 0;
    z-index: 10;
  }

  .btn-record {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-record .inner {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #e94560;
    transition: all 0.3s;
  }

  .btn-record.recording .inner {
    width: 28px;
    height: 28px;
    border-radius: 8px;
  }

  .btn-secondary {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s;
  }

  .btn-secondary:active { background: rgba(255,255,255,0.15); }
  .btn-secondary.has-video { border-color: #00e676; color: #00e676; }

  .init-screen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    gap: 14px;
    padding: 32px;
    text-align: center;
  }

  .init-screen h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: #e94560;
    font-weight: 800;
  }

  .init-screen p {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
    max-width: 300px;
  }

  .init-screen .warn {
    font-size: 12px;
    color: #ffc107;
    background: rgba(255,193,7,0.1);
    border: 1px solid rgba(255,193,7,0.2);
    border-radius: 8px;
    padding: 10px 16px;
    max-width: 300px;
    line-height: 1.5;
  }

  .btn-start {
    margin-top: 4px;
    padding: 14px 40px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-start:active {
    transform: scale(0.96);
    background: #c81e45;
  }

  .offset-info {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: rgba(255,255,255,0.35);
    text-shadow: 0 0 6px rgba(0,0,0,0.95);
    z-index: 5;
    pointer-events: none;
  }

  .toast {
    position: absolute;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #fff;
    background: rgba(0,0,0,0.75);
    padding: 10px 20px;
    border-radius: 10px;
    z-index: 30;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    text-align: center;
    max-width: 80%;
    white-space: pre-line;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header">
  <h1>🔒 TIMESTAMP CAM</h1>
  <div class="sync-badge" id="syncBadge">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">대기중</span>
  </div>
</div>

<div class="camera-container">
  <video id="videoElement" autoplay playsinline muted></video>
  <canvas id="recordCanvas"></canvas>

  <div class="timestamp-overlay" id="tsOverlay" style="display:none">
    <div class="ts-main" id="tsTime">--:--:--</div>
    <div class="ts-date" id="tsDate">----.--.--</div>
    <div class="ts-source" id="tsSource"></div>
  </div>

  <div class="rec-indicator" id="recIndicator">
    <div class="rec-dot"></div>
    <span class="rec-text">REC</span>
    <span class="rec-time" id="recTime">00:00</span>
  </div>

  <div class="offset-info" id="offsetInfo"></div>
  <div class="toast" id="toast"></div>

  <div class="init-screen" id="initScreen">
    <h2>🔒 인증 타임스탬프 카메라</h2>
    <p>NTP 서버 시간 기반으로<br>조작 불가능한 타임스탬프를<br>영상에 실시간 오버레이합니다</p>
    <div class="warn">⚠️ 이 파일을 다운로드 후<br>크롬 또는 삼성인터넷에서 열어주세요<br>Claude 앱 내부에서는 작동 안 됩니다</div>
    <button class="btn-start" id="btnStart">카메라 시작</button>
  </div>
</div>

<div class="controls">
  <button class="btn-secondary" id="btnFlip" title="카메라 전환">🔄</button>
  <button class="btn-record" id="btnRecord"><div class="inner"></div></button>
  <button class="btn-secondary" id="btnDownload" title="다운로드">💾</button>
</div>

<script>
(function() {
  var ntpOffset = 0;
  var isSynced = false;
  var stream = null;
  var mediaRecorder = null;
  var recordedChunks = [];
  var isRecording = false;
  var recordStart = 0;
  var recordTimer = null;
  var lastVideoUrl = null;
  var facingMode = 'environment';
  var cameraReady = false;

  var video = document.getElementById('videoElement');
  var canvas = document.getElementById('recordCanvas');
  var ctx = canvas.getContext('2d');
  var syncDot = document.getElementById('syncDot');
  var syncStatusEl = document.getElementById('syncStatus');
  var syncBadge = document.getElementById('syncBadge');
  var tsTime = document.getElementById('tsTime');
  var tsDate = document.getElementById('tsDate');
  var tsSource = document.getElementById('tsSource');
  var tsOverlay = document.getElementById('tsOverlay');
  var recIndicator = document.getElementById('recIndicator');
  var recTimeEl = document.getElementById('recTime');
  var offsetInfo = document.getElementById('offsetInfo');
  var toastEl = document.getElementById('toast');
  var btnStart = document.getElementById('btnStart');
  var btnRecord = document.getElementById('btnRecord');
  var btnFlip = document.getElementById('btnFlip');
  var btnDownload = document.getElementById('btnDownload');
  var initScreen = document.getElementById('initScreen');

  function showToast(msg, dur) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(function() { toastEl.classList.remove('show'); }, dur || 2000);
  }

  // ===== NTP SYNC =====
  async function syncTime() {
    syncDot.className = 'sync-dot syncing';
    syncStatusEl.textContent = '동기화중..';

    var apis = [
      {
        url: 'https://worldtimeapi.org/api/timezone/Asia/Seoul',
        parse: function(d) { return new Date(d.datetime).getTime(); }
      },
      {
        url: 'https://worldtimeapi.org/api/ip',
        parse: function(d) { return new Date(d.datetime).getTime(); }
      },
      {
        url: 'https://timeapi.io/api/time/current/zone?timeZone=Asia/Seoul',
        parse: function(d) {
          return new Date(
            d.year + '-' + String(d.month).padStart(2,'0') + '-' +
            String(d.day).padStart(2,'0') + 'T' +
            String(d.hour).padStart(2,'0') + ':' +
            String(d.minute).padStart(2,'0') + ':' +
            String(d.seconds).padStart(2,'0') + '.000+09:00'
          ).getTime();
        }
      }
    ];

    for (var i = 0; i < apis.length; i++) {
      try {
        var t1 = Date.now();
        var controller = new AbortController();
        var tid = setTimeout(function() { controller.abort(); }, 5000);
        var resp = await fetch(apis[i].url, { signal: controller.signal });
        clearTimeout(tid);
        var t2 = Date.now();
        var data = await resp.json();
        var serverTime = apis[i].parse(data);

        if (isNaN(serverTime)) continue;

        var latency = (t2 - t1) / 2;
        ntpOffset = serverTime - t1 - latency;
        isSynced = true;

        syncDot.className = 'sync-dot synced';
        syncStatusEl.textContent = 'NTP동기화';
        tsSource.textContent = '🔒 NTP 서버 시간 (조작불가)';
        tsSource.className = 'ts-source';
        offsetInfo.textContent = 'offset: ' + (ntpOffset > 0 ? '+' : '') + Math.round(ntpOffset) + 'ms | ' + apis[i].url.split('/')[2];
        showToast('✅ 서버 시간 동기화 완료', 1500);
        return;
      } catch(e) {
        console.warn('Sync failed:', apis[i].url, e.message);
      }
    }

    // Fallback to local
    isSynced = false;
    ntpOffset = 0;
    syncDot.className = 'sync-dot local';
    syncStatusEl.textContent = '로컬시간';
    tsSource.textContent = '⚠ 로컬 시간 (자동시간 ON 권장)';
    tsSource.className = 'ts-source not-synced';
    offsetInfo.textContent = '서버 연결 불가 → 로컬 시간 사용중';
    showToast('서버 연결 실패\n로컬 시간으로 작동합니다', 2500);
  }

  syncBadge.addEventListener('click', function() {
    if (!cameraReady) return;
    showToast('재동기화 시도중...', 1500);
    syncTime();
  });

  function getNow() { return new Date(Date.now() + ntpOffset); }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function formatTime(d) { return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); }
  function formatMs(d) { return '.' + String(d.getMilliseconds()).padStart(3, '0').slice(0, 2); }
  function formatDate(d) {
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate()) + ' (' + days[d.getDay()] + ')';
  }

  // ===== CAMERA =====
  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: true
      });
      video.srcObject = stream;
      await video.play();
      cameraReady = true;
      initScreen.style.display = 'none';
      tsOverlay.style.display = 'block';
      video.addEventListener('loadedmetadata', function() {
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
      });
      startRenderLoop();
    } catch(e) {
      alert('카메라 접근 실패: ' + e.message + '\n\n이 파일을 다운로드 후\n크롬이나 삼성인터넷 브라우저에서\n직접 열어주세요.');
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function startRenderLoop() {
    function render() {
      if (!cameraReady) { requestAnimationFrame(render); return; }
      if (video.readyState >= 2) {
        var vw = video.videoWidth || 1280;
        var vh = video.videoHeight || 720;
        canvas.width = vw;
        canvas.height = vh;
        ctx.drawImage(video, 0, 0, vw, vh);

        var now = getNow();
        var timeStr = formatTime(now) + formatMs(now);
        var dateStr = formatDate(now);
        var syncLabel = isSynced ? 'NTP SYNCED | TAMPER-PROOF' : 'LOCAL TIME';
        var lockIcon = isSynced ? '🔒' : '⚠';

        var scale = Math.max(vw / 400, 1);
        var pad = 16 * scale;
        var boxW = Math.min(vw * 0.78, 360 * scale);
        var boxH = 78 * scale;

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, pad, pad, boxW, boxH, 8 * scale);
        ctx.fill();

        // Accent bar
        ctx.fillStyle = isSynced ? '#00e676' : '#ffc107';
        roundRect(ctx, pad, pad, 4 * scale, boxH, 2 * scale);
        ctx.fill();

        var tx = pad + 14 * scale;

        ctx.font = 'bold ' + Math.round(32 * scale) + 'px JetBrains Mono, monospace';
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';
        ctx.fillText(timeStr, tx, pad + 6 * scale);

        ctx.font = Math.round(13 * scale) + 'px JetBrains Mono, monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillText(dateStr, tx, pad + 42 * scale);

        ctx.font = 'bold ' + Math.round(9 * scale) + 'px JetBrains Mono, monospace';
        ctx.fillStyle = isSynced ? '#00e676' : '#ffc107';
        ctx.fillText(lockIcon + ' ' + syncLabel, tx, pad + 60 * scale);

        // REC badge on canvas
        if (isRecording) {
          var elapsed = Math.floor((Date.now() - recordStart) / 1000);
          var mm = pad2(Math.floor(elapsed / 60));
          var ss = pad2(elapsed % 60);
          var rw = 100 * scale;
          var rh = 26 * scale;
          var rx = vw - pad - rw;
          var ry = pad;

          ctx.fillStyle = 'rgba(233,69,96,0.9)';
          roundRect(ctx, rx, ry, rw, rh, 5 * scale);
          ctx.fill();

          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(rx + 12 * scale, ry + rh / 2, 5 * scale, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = 'bold ' + Math.round(13 * scale) + 'px JetBrains Mono, monospace';
          ctx.fillStyle = '#fff';
          ctx.textBaseline = 'top';
          ctx.fillText('REC ' + mm + ':' + ss, rx + 22 * scale, ry + 5 * scale);
        }
      }

      // HTML overlay update
      var now2 = getNow();
      tsTime.textContent = formatTime(now2) + formatMs(now2);
      tsDate.textContent = formatDate(now2);

      requestAnimationFrame(render);
    }
    render();
  }

  // ===== RECORDING =====
  function startRecording() {
    if (!cameraReady) { showToast('카메라를 먼저 시작하세요'); return; }
    recordedChunks = [];

    var canvasStream = canvas.captureStream(30);
    if (stream) {
      var at = stream.getAudioTracks();
      for (var i = 0; i < at.length; i++) canvasStream.addTrack(at[i]);
    }

    var mimes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
    var opts = {};
    for (var j = 0; j < mimes.length; j++) {
      if (MediaRecorder.isTypeSupported(mimes[j])) { opts = { mimeType: mimes[j] }; break; }
    }

    try {
      mediaRecorder = new MediaRecorder(canvasStream, opts);
    } catch(e) {
      showToast('녹화 실패: ' + e.message, 3000);
      return;
    }

    mediaRecorder.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = function() {
      var blob = new Blob(recordedChunks, { type: opts.mimeType || 'video/webm' });
      if (lastVideoUrl) URL.revokeObjectURL(lastVideoUrl);
      lastVideoUrl = URL.createObjectURL(blob);
      btnDownload.classList.add('has-video');
      showToast('✅ 녹화 완료! 💾으로 저장', 2500);
    };
    mediaRecorder.onerror = function(e) {
      showToast('녹화 오류', 2000);
      stopRecording();
    };

    mediaRecorder.start(500);
    isRecording = true;
    recordStart = Date.now();
    btnRecord.classList.add('recording');
    recIndicator.classList.add('active');
    showToast('🔴 녹화 시작', 1000);

    recordTimer = setInterval(function() {
      var el = Math.floor((Date.now() - recordStart) / 1000);
      recTimeEl.textContent = pad2(Math.floor(el / 60)) + ':' + pad2(el % 60);
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    isRecording = false;
    btnRecord.classList.remove('recording');
    recIndicator.classList.remove('active');
    if (recordTimer) clearInterval(recordTimer);
    recTimeEl.textContent = '00:00';
  }

  // ===== EVENTS =====
  btnStart.addEventListener('click', function() {
    startCamera();
    syncTime();
  });

  btnRecord.addEventListener('click', function() {
    if (isRecording) stopRecording();
    else startRecording();
  });

  btnFlip.addEventListener('click', function() {
    if (isRecording) { showToast('녹화 중 전환 불가', 1500); return; }
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    showToast(facingMode === 'user' ? '📱 전면' : '📸 후면', 1000);
    startCamera();
  });

  btnDownload.addEventListener('click', function() {
    if (!lastVideoUrl) { showToast('녹화된 영상 없음', 1500); return; }
    var now = getNow();
    var fn = 'PROOF_' + now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate()) + '_' +
      pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + '.webm';
    var a = document.createElement('a');
    a.href = lastVideoUrl;
    a.download = fn;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('📥 ' + fn, 2000);
  });

  setInterval(function() { syncTime(); }, 300000);
})();
</script>
</body>
</html>
